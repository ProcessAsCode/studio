<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Algomation Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- BPMN.js styles -->
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.0.1/dist/assets/diagram-js.css" />
  <link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.0.1/dist/assets/bpmn-font/css/bpmn.css" />

  <!-- DMN.js styles -->
  <link rel="stylesheet" href="https://unpkg.com/dmn-js@14.5.0/dist/assets/dmn-js-decision-table.css" />
  <link rel="stylesheet" href="https://unpkg.com/dmn-js@14.5.0/dist/assets/dmn-js-drd.css" />
  <link rel="stylesheet" href="https://unpkg.com/dmn-js@14.5.0/dist/assets/dmn-js-literal-expression.css" />
  <link rel="stylesheet" href="https://unpkg.com/dmn-js@14.5.0/dist/assets/dmn-font/css/dmn.css" />

  <!-- CMMN.js styles -->
  <link rel="stylesheet" href="https://unpkg.com/cmmn-js@0.20.0/dist/assets/diagram-js.css" />
  <link rel="stylesheet" href="https://unpkg.com/cmmn-js@0.20.0/dist/assets/cmmn-font/css/cmmn.css" />

  <!-- Your app styling (you can leave css/style.css empty or minimal) -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <div class="app-logo">Algomation Studio</div>
    <div class="app-actions">
      <button id="btn-new-project">New Project</button>
      <button id="btn-import-uapf">Import UAPF (soon)</button>
      <button id="btn-export-uapf">Export UAPF</button>
    </div>
  </header>

  <main class="app-main">
    <aside class="app-sidebar">
      <h3>Projects</h3>
      <ul id="project-list"><li>Single-project demo mode</li></ul>
    </aside>

    <section class="app-workspace">
      <nav class="app-tabs">
        <button class="tab-button active" data-tab="bpmn">Process (BPMN)</button>
        <button class="tab-button" data-tab="dmn">Decisions (DMN)</button>
        <button class="tab-button" data-tab="cmmn">Cases (CMMN)</button>
        <button class="tab-button" data-tab="manifest">Manifest</button>
      </nav>

      <section class="app-tab-content">
        <div id="tab-bpmn" class="tab-panel active">
          <div id="bpmn-canvas" class="modeler-canvas"></div>
        </div>
        <div id="tab-dmn" class="tab-panel">
          <div id="dmn-canvas" class="modeler-canvas"></div>
        </div>
        <div id="tab-cmmn" class="tab-panel">
          <div id="cmmn-canvas" class="modeler-canvas"></div>
        </div>
        <div id="tab-manifest" class="tab-panel">
          <textarea id="manifest-editor" class="manifest-editor" spellcheck="false"></textarea>
        </div>
      </section>
    </section>
  </main>

  <input type="file" id="uapf-file-input" accept=".uapf" style="display:none" />

  <!-- Libraries (all working versions) -->
  <script src="https://unpkg.com/bpmn-js@17.0.1/dist/bpmn-modeler.production.min.js"></script>
  <script src="https://unpkg.com/dmn-js@14.5.0/dist/dmn-modeler.production.min.js"></script>
  <script src="https://unpkg.com/cmmn-js@0.20.0/dist/cmmn-modeler.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
