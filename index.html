<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Algomation Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- BPMN modeler styles (palette, context pad, etc.) -->
  <link rel="stylesheet"
        href="https://unpkg.com/bpmn-js@11.5.0/dist/assets/diagram-js.css" />
  <link rel="stylesheet"
        href="https://unpkg.com/bpmn-js@11.5.0/dist/assets/bpmn-font/css/bpmn-embedded.css" />
  <!-- Simple base styling, can be replaced with Bootstrap later -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-logo">Algomation Studio</div>
    <div class="app-actions">
      <button id="btn-new-project">New Project</button>
      <button id="btn-import-uapf">Import UAPF</button>
      <button id="btn-export-uapf">Export UAPF</button>
    </div>
  </header>

  <main class="app-main">
    <aside class="app-sidebar">
      <h3>Projects</h3>
      <ul id="project-list"></ul>
    </aside>

    <section class="app-workspace">
      <nav class="app-tabs">
        <button class="tab-button active" data-tab="bpmn">Process (BPMN)</button>
        <button class="tab-button" data-tab="dmn">Decisions (DMN)</button>
        <button class="tab-button" data-tab="cmmn">Cases (CMMN)</button>
        <button class="tab-button" data-tab="manifest">Manifest</button>
      </nav>

      <section class="app-tab-content">
        <div id="tab-bpmn" class="tab-panel active">
          <div id="bpmn-canvas" class="modeler-canvas"></div>
        </div>

        <div id="tab-dmn" class="tab-panel">
          <div id="dmn-canvas" class="modeler-canvas"></div>
        </div>

        <div id="tab-cmmn" class="tab-panel">
          <div id="cmmn-canvas" class="modeler-canvas"></div>
        </div>

        <div id="tab-manifest" class="tab-panel">
          <textarea id="manifest-editor" class="manifest-editor"></textarea>
        </div>
      </section>
    </section>
  </main>

  <!-- Hidden file input for UAPF import -->
  <input type="file" id="uapf-file-input" accept=".uapf" style="display:none" />

  <!-- BPMN Modeler (bpmn.io) UMD bundle -->
  <script src="https://unpkg.com/bpmn-js@11.5.0/dist/bpmn-modeler.development.js"></script>

  <!-- DMN Modeler (dmn-js) UMD bundle -->
  <script src="https://unpkg.com/dmn-js@15.5.0/dist/dmn-modeler.development.js"></script>

  <!-- CMMN Modeler (cmmn-js) UMD bundle -->
  <script src="https://unpkg.com/cmmn-js@0.20.0/dist/cmmn-modeler.development.js"></script>

  <!-- Your app entry -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
